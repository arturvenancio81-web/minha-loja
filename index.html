<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FARMÁCIA STORE - Tudo o que você precisa</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background-color: #f4f4f4;
      color: #333;
    }

    /* Topo / Header */
    header {
      background-color: #00a859;
      padding: 15px 20px;
      color: white;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
    }

    .logo span {
      background-color: white;
      color: #00a859;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 14px;
      margin-left: 5px;
    }

    .search-box {
      display: flex;
      flex: 1;
      max-width: 500px;
    }

    .search-box input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 4px 0 0 4px;
      outline: none;
    }

    .search-box button {
      background-color: #008747;
      color: white;
      border: none;
      padding: 10px 15px;
      border-radius: 0 4px 4px 0;
      cursor: pointer;
    }

    /* Banner */
    .banner {
      background-color: #00a859;
      color: white;
      padding: 15px 20px;
      margin-bottom: 20px;
      border-top: 1px solid rgba(255,255,255,0.2);
    }

    /* Categorias */
    .categories {
      display: flex;
      gap: 10px;
      padding: 0 20px;
      overflow-x: auto;
      margin-bottom: 25px;
    }

    .btn-category {
      background-color: white;
      border: 1px solid #ddd;
      padding: 8px 15px;
      border-radius: 20px;
      cursor: pointer;
      white-space: nowrap;
      font-size: 14px;
    }

    .btn-category.active {
      background-color: #00a859;
      color: white;
      border-color: #00a859;
    }

    /* Seção de Produtos */
    .container {
      padding: 0 20px 40px 20px;
    }

    .section-title {
      font-size: 20px;
      margin-bottom: 15px;
    }

    .products-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
    }

    /* Card do Produto */
    .product-card {
      background-color: white;
      border-radius: 8px;
      padding: 15px;
      position: relative;
      box-shadow: 0 2px 5px rgba(0,0,0,0.05);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .discount-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background-color: #e53935;
      color: white;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 6px;
      border-radius: 3px;
      z-index: 2;
    }

    .img-container {
      height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 10px;
      border-bottom: 1px solid #f0f0f0;
      padding-bottom: 10px;
    }

    .product-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .product-title {
      font-size: 15px;
      font-weight: 600;
      margin-bottom: 8px;
      height: 40px;
      overflow: hidden;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      color: #000;
      margin-bottom: 4px;
    }

    .installments {
      font-size: 12px;
      color: #777;
      margin-bottom: 8px;
    }

    .shipping {
      font-size: 12px;
      color: #00a859;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .btn-buy {
      background-color: #0d6efd;
      color: white;
      border: none;
      padding: 10px;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
      width: 100%;
    }

    .btn-buy:hover {
      background-color: #0b5ed7;
    }

    .no-products {
      grid-column: 1 / -1;
      text-align: center;
      color: #666;
      padding: 40px;
    }
  </style>
</head>
<body>

  <!-- Topo -->
  <header>
    <div class="logo">FARMÁCIA <span>STORE</span></div>
    <div class="search-box">
      <input type="text" id="searchInput" placeholder="O que você está procurando hoje?" onkeyup="buscarProduto()">
      <button onclick="buscarProduto()">Buscar</button>
    </div>
  </header>

  <!-- Banner -->
  <div class="banner">
    <h2>Tem de tudo na Farmácia! 🛒</h2>
    <p>As melhores ofertas, eletrônicos, utilidades e itens para o seu dia a dia.</p>
  </div>

  <!-- Categorias -->
  <div class="categories">
    <button class="btn-category active" onclick="filtrarCategoria('todos', this)">Todos os Produtos</button>
    <button class="btn-category" onclick="filtrarCategoria('eletronicos', this)">Eletrônicos</button>
    <button class="btn-category" onclick="filtrarCategoria('casa', this)">Casa & Cozinha</button>
    <button class="btn-category" onclick="filtrarCategoria('moda', this)">Moda & Acessórios</button>
    <button class="btn-category" onclick="filtrarCategoria('ofertas', this)">Ofertas do Dia</button>
  </div>

  <!-- Lista de Produtos -->
  <div class="container">
    <h3 class="section-title">Oportunidades em Destaque</h3>
    
    <div class="products-grid" id="productsGrid">
      <!-- Produtos renderizados aqui -->
    </div>
  </div>

  <script>
    // Lista fixa de produtos
    const produtos = [
      {
        id: 1,
        nome: "Rapaz bonito e fiel solteiro",
        preco: "0,00",
        parcelas: "em até 3x de R$ 0,00 sem juros",
        imagem: "rapaz.jpg",
        categoria: "moda"
      },
      {
        id: 2,
        nome: "camisa original",
        preco: "40,00",
        parcelas: "em até 3x de R$ 13,33 sem juros",
        imagem: "camisa.jpg",
        categoria: "moda"
      },
      {
        id: 3,
        nome: "Lamborghini",
        preco: "25,50",
        parcelas: "em até 3x de R$ 8,50 sem juros",
        imagem: "lamborghini.jpg",
        categoria: "ofertas"
      }
    ];

    function renderizarProdutos(lista) {
      const grid = document.getElementById('productsGrid');
      grid.innerHTML = '';

      if (lista.length === 0) {
        grid.innerHTML = '<p class="no-products">Nenhum produto encontrado.</p>';
        return;
      }

      lista.forEach(p => {
        grid.innerHTML += `
          <div class="product-card">
            <span class="discount-badge">OFERTA</span>
            <div class="img-container">
              <img src="${p.imagem}" alt="${p.nome}" class="product-img" onerror="this.src='https://via.placeholder.com/150?text=Sem+Imagem'">
            </div>
            <h3 class="product-title">${p.nome}</h3>
            <div class="price">R$ ${p.preco}</div>
            <div class="installments">${p.parcelas}</div>
            <div class="shipping">⚡ Frete Grátis</div>
            <button class="btn-buy">Comprar agora</button>
          </div>
        `;
      });
    }

    function buscarProduto() {
      const termo = document.getElementById('searchInput').value.toLowerCase();
      const filtrados = produtos.filter(p => p.nome.toLowerCase().includes(termo));
      renderizarProdutos(filtrados);
    }

    function filtrarCategoria(cat, btn) {
      document.querySelectorAll('.btn-category').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');

      if (cat === 'todos') {
        renderizarProdutos(produtos);
      } else {
        const filtrados = produtos.filter(p => p.categoria === cat);
        renderizarProdutos(filtrados);
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderizarProdutos(produtos);
    });
  </script>
</body>
</html>
